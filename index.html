<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Programmatore Appalto Cassano</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --p:#14532d;--pm:#166534;--pl:#22c55e;--acc:#e8a020;
  --sfondo:#f0faf4;--bianco:#fff;--testo:#14532d;--grigio:#6b8f72;
  --bordo:#bbf7d0;--verde:#15803d;--rosso:#b83228;--arancio:#c97010;
  --blu:#1d4ed8;--viola:#7c3aed;
  --mono:'Courier New',monospace;
  --shadow:0 1px 4px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--sfondo);color:var(--testo);min-height:100vh;font-size:14px;}

#app{display:none;}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#f0faf4,#dcfce7);}
.auth-card{width:min(420px,100%);background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:24px;box-shadow:0 14px 40px rgba(20,83,45,.14);}
.auth-card h2{margin-bottom:8px;color:var(--p);}.auth-card p{color:var(--grigio);line-height:1.45;margin-bottom:16px;}
.auth-card .fg{margin-bottom:11px}.auth-card .btn{width:100%;justify-content:center;margin-top:5px;}
.sync-state{font-size:.7rem;color:rgba(255,255,255,.8);white-space:nowrap;}
header{background:var(--p);color:white;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.hlogo{display:flex;align-items:center;gap:10px;}
.hlogo-icon{width:32px;height:32px;background:rgba(255,255,255,0.15);border-radius:7px;display:flex;align-items:center;justify-content:center;}
.hlogo-icon svg{width:18px;height:18px;fill:none;stroke:white;stroke-width:2.2;}
header h1{font-size:0.95rem;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;}
.hright{display:flex;align-items:center;gap:10px;}

nav{background:var(--pm);display:flex;padding:0 16px;overflow-x:auto;gap:0;position:relative;z-index:50;}
nav::-webkit-scrollbar{height:2px;}
nav button{background:none;border:none;color:rgba(255,255,255,0.5);padding:12px 16px;font-size:0.78rem;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:color 0.12s;display:flex;align-items:center;gap:6px;}
nav button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;}
nav button:hover{color:rgba(255,255,255,0.85);}
nav button.on{color:var(--acc);border-bottom-color:var(--acc);}

main{padding:20px 16px;max-width:1200px;margin:0 auto;}
.tab{display:none;}.tab.on{display:block;}

.card{background:var(--bianco);border:1px solid var(--bordo);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
.ct{font-size:0.68rem;font-weight:800;color:var(--grigio);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--sfondo);display:flex;align-items:center;gap:6px;}
.ct svg{width:14px;height:14px;fill:none;stroke:var(--grigio);stroke-width:2;}

.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:0.67rem;font-weight:700;color:var(--grigio);text-transform:uppercase;letter-spacing:0.05em;}
.fg input,.fg select{border:1.5px solid var(--bordo);border-radius:6px;padding:8px 10px;font-size:0.88rem;color:var(--testo);background:var(--sfondo);transition:all 0.12s;}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--p);border-width:2px;background:#fffde8;}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.ga{grid-column:1/-1;}

.btn{padding:8px 16px;border:none;border-radius:6px;font-size:0.81rem;font-weight:700;cursor:pointer;transition:all 0.12s;display:inline-flex;align-items:center;gap:5px;}
.btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;}
.btn:hover{filter:brightness(0.92);}
.bp{background:var(--p);color:white;}
.bv{background:var(--verde);color:white;}
.br{background:var(--rosso);color:white;padding:5px 10px;font-size:0.73rem;}
.ba{background:var(--acc);color:var(--p);}
.bo{background:transparent;border:1.5px solid var(--bordo);color:var(--testo);}
.bo:hover{border-color:var(--pl);color:var(--verde);filter:none;}
.bsm{padding:4px 10px;font-size:0.73rem;}

.daytabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:14px;border-bottom:1.5px solid var(--bordo);padding-bottom:0;}
.daytab{background:none;border:none;color:var(--grigio);padding:8px 12px;font-size:0.76rem;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0;}
.daytab:hover{background:var(--sfondo);color:var(--testo);}
.daytab.on{color:var(--p);border-bottom-color:var(--p);background:var(--sfondo);}
.turno2col{border-left:2px solid var(--bordo);}
.turnigrid2 select,.turnigrid2 input{font-size:0.76rem;padding:3px 4px;border:1px solid var(--bordo);border-radius:4px;width:100%;min-width:78px;}
.turnigrid2 td{padding:4px 3px;vertical-align:middle;}
.turnigrid2 th{font-size:0.68rem;padding:5px 3px;white-space:nowrap;}
.rigaassente input,.rigaassente select{opacity:0.35;pointer-events:none;}
.brow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}

.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:0.81rem;}
th{background:var(--sfondo);color:var(--grigio);font-size:0.64rem;font-weight:800;text-transform:uppercase;letter-spacing:0.07em;padding:8px 10px;text-align:left;border-bottom:2px solid var(--bordo);white-space:nowrap;}
td{padding:6px 8px;border-bottom:1px solid var(--bordo);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#f5fbf7;}

.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.69rem;font-weight:700;}
.pg{background:#d3f0e3;color:var(--verde);}
.py{background:#fdefd3;color:var(--arancio);}
.pb{background:#dbeafe;color:var(--blu);}
.pr{background:#fde3e1;color:var(--rosso);}

.alert{padding:9px 13px;border-radius:6px;font-size:0.82rem;font-weight:600;margin-bottom:12px;}
.aok{background:#d3f0e3;color:var(--verde);border:1px solid #a5d9be;}
.aerr{background:#fde3e1;color:var(--rosso);border:1px solid #f4b0ab;}
.awarn{background:#fdefd3;color:var(--arancio);border:1px solid #f5d494;}

#toast{position:fixed;bottom:20px;right:20px;z-index:999;padding:11px 18px;border-radius:8px;font-size:0.84rem;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.25);opacity:0;transform:translateY(8px);transition:opacity 0.2s,transform 0.2s;pointer-events:none;max-width:300px;color:white;}
#toast.show{opacity:1;transform:translateY(0);}

.empty{text-align:center;color:var(--grigio);padding:28px;font-size:0.84rem;}
.loading{text-align:center;color:var(--grigio);padding:20px;font-size:0.82rem;}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.stat{background:var(--bianco);border:1px solid var(--bordo);border-radius:8px;padding:14px;text-align:center;}
.stat .n{font-size:1.4rem;font-weight:900;color:var(--p);font-variant-numeric:tabular-nums;}
.stat .l{font-size:0.63rem;color:var(--grigio);text-transform:uppercase;letter-spacing:0.05em;margin-top:3px;}
.stat.warn .n{color:var(--arancio);}
.stat.err .n{color:var(--rosso);}
.cfg-note{font-size:.78rem;color:var(--grigio);margin:-4px 0 12px;line-height:1.45;}
.cfg-section{border:1px solid var(--bordo);border-radius:8px;margin:10px 0;background:#fff;overflow:hidden;}
.cfg-section summary{cursor:pointer;padding:11px 13px;font-weight:800;background:var(--sfondo);}
.cfg-section .cfg-body{padding:12px;}
.cfg-input{width:82px;padding:5px 7px;border:1px solid var(--bordo);border-radius:5px;color:var(--testo);}
.cfg-time{width:105px;}
.pdf-shift{display:inline-block;margin:2px 4px 2px 0;padding:4px 7px;border-radius:5px;background:#e8f5ed;border:1px solid var(--bordo);font-size:.72rem;white-space:nowrap;}
.pdf-shift b{color:var(--p);}
.azioni-turno{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:36px;}
.azioni-turno .btn-icona{width:32px;height:28px;padding:0;justify-content:center;font-size:1rem;line-height:1;}

/* Griglia turni settimanale */
.turnigrid{border-collapse:collapse;font-size:0.78rem;}
.turnigrid th,.turnigrid td{border:1px solid var(--bordo);padding:4px 6px;}
.turnigrid th{background:var(--sfondo);font-size:0.66rem;text-transform:uppercase;color:var(--grigio);}
.turnigrid td.nome{font-weight:700;white-space:nowrap;background:#fafffa;position:sticky;left:0;}

@media print{
  header,nav,.no-print{display:none!important;}
  main{max-width:100%;padding:0;}
  body{background:white;}
  .card{box-shadow:none;border:none;}
}
@media(max-width:640px){
  .g4,.g3{grid-template-columns:1fr 1fr;}
  .ga{grid-column:1/-1;}
}
</style>
</head>
<body>
<div id="toast"></div>

<div id="auth-screen" class="auth-screen">
  <form class="auth-card" onsubmit="accediResponsabile(event)">
    <h2>Programmatore Cassano</h2>
    <p>Accesso riservato ai responsabili autorizzati. Le credenziali non vengono salvate nel file HTML.</p>
    <div class="fg"><label>Email</label><input id="auth-email" type="email" autocomplete="username" required></div>
    <div class="fg"><label>Password</label><input id="auth-password" type="password" autocomplete="current-password" required></div>
    <button id="auth-submit" class="btn bp" type="submit">Accedi</button>
    <div id="auth-msg" style="margin-top:12px;"></div>
  </form>
</div>

<div id="app">
  <header>
    <div class="hlogo">
      <div class="hlogo-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M8 3v3"/><path d="M16 3v3"/></svg>
      </div>
      <h1>Programmatore Appalto — Cassano Magnago</h1>
    </div>
    <div class="hright no-print"><span id="sync-state" class="sync-state"></span><button class="btn bo bsm" style="color:white;border-color:rgba(255,255,255,.45)" onclick="esciResponsabile()">Esci</button></div>
  </header>
  <nav class="no-print">
    <button id="nav-config" class="on" onclick="showTab('config')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Configurazione
    </button>
    <button id="nav-previsione" onclick="showTab('previsione')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>
      Previsione Ortofrutta
    </button>
    <button id="nav-appalto" onclick="showTab('appalto')">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Programmazione
    </button>
    <button id="nav-controllo" onclick="showTab('controllo')">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>
      Colli Reali & Controllo
    </button>
  </nav>
  <main id="mc"></main>
</div>

<script>
const SB_URL='https://eqtyfnluswalfassmlxd.supabase.co';
const SB_KEY='sb_publishable_QFxWloxs6waJCTvV1jtuPQ_MI7K4foM';
const sb=supabase.createClient(SB_URL,SB_KEY);
let SESSIONE_CASSANO=null;

function projectIdValido(){return SB_URL==='https://eqtyfnluswalfassmlxd.supabase.co';}
function responsabileAutorizzato(sessione){return sessione?.user?.app_metadata?.cassano_turni===true||sessione?.user?.app_metadata?.cassano_turni==='true';}
function statoSync(testo){const el=document.getElementById('sync-state');if(el)el.textContent=testo||'';}

// Costanti di dominio — reparto Ortofrutta (ID_Reparto 2) sul magazzino Cassano (ID_Magazzino 1)
const ID_MAGAZZINO_CASSANO=1;
const ID_REPARTO_ORTOFRUTTA=2;
const ATTIVITA_PRODUTTIVITA={14:'Ricevimento',15:'Ventilazione',16:'Legaggio'};
const ID_ATTIVITA_RICEVIMENTO=14;
const ID_ATTIVITA_VENTILAZIONE=15;
const ID_ATTIVITA_LEGAGGIO=16;
let ID_ATTIVITA_NAVETTA=null; // trovato per nome nel catalogo Nexus, vedi caricaCatalogoAttivita
const GIORNI=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const ETICHETTE_TAB=[...GIORNI,'Lunedì +1'];
const CONFIG_APPALTO_KEY='nexus_config_appalto_cassano_v2';
const DEFAULT_CONFIG_APPALTO={
  sogliaProduttivita:115,
  ricevimento:[0,0,0,0,0,0,0],
  carico:[31,41.5,41,42,48.5,57,63],
  ceste:[
    [['06:00','11:00'],['06:00','12:00'],['12:00','17:00'],['12:00','19:00'],['18:00','02:30'],['19:00','02:00']],
    [['06:00','11:00'],['06:00','12:00'],['12:00','17:00'],['12:00','19:00'],['18:00','02:30'],['19:00','02:00']],
    [['06:00','11:00'],['06:00','12:00'],['12:00','17:00'],['12:00','18:30'],['18:00','02:30'],['18:30','02:00']],
    [['06:00','11:00'],['06:00','12:00'],['12:00','17:00'],['12:00','18:30'],['18:00','02:30'],['18:30','02:00']],
    [['06:00','11:00'],['06:00','12:00'],['12:00','17:00'],['12:00','18:30'],['18:30','02:00'],['19:00','02:00']],
    [['06:00','10:30'],['06:00','13:00'],['11:00','18:00'],['12:00','18:30'],['18:30','02:00'],['19:00','02:00']],
    [['06:00','11:00'],['06:00','13:00'],['12:00','18:00'],['12:00','18:30'],['18:00','02:00'],['18:30','02:00']]
  ],
  forno:Array.from({length:7},(_,i)=>[[3,'08:00','15:00'],[i===6?0:1,i===5?'11:30':'12:00',i===5?'16:30':'17:00'],[1,'14:30','21:00'],[i===6?0:1,'15:00','19:00'],[3,'20:00','04:00']]),
  vuoti:[[2,1,2,1,3,1,2,1,1,1],[3,1,3,1,3,1,1,1,1,1],[3,1,2,1,3,1,1,1,1,1],[3,1,3,1,3,1,1,1,1,1],[3,1,2,1,3,1,1,1,1,1],[3,1,3,1,3,1,1,1,1,1],[1,0,2,0,1,0,1,0,1,0]],
  grocery:[[2,1,2,4],[3,1,2,3],[3,1,2,3],[3,1,2,3],[3,1,2,3],[0,0,3,4],[0,0,0,0]]
};
const VUOTI_MODELLI=[
  ['Compattatori','06:00','12:30'],['Compattatori','15:30','19:30'],
  ['Muletto','06:00','12:30'],['Muletto','15:30','19:30'],
  ['Navetta','06:30','13:00'],['Navetta','15:30','19:30'],
  ['Pane','06:00','12:30'],['Pane','15:30','19:30'],
  ['Polimer','06:00','12:30'],['Pulizie','06:00','12:30']
];
const GROCERY_MODELLI=[
  ['Ricevimento','06:00','12:30'],['Stoccaggio','06:00','12:30'],
  ['Abbassamenti','06:00','12:30'],['Navettaggio','06:30','13:00']
];
DEFAULT_CONFIG_APPALTO.fabbisogni={
  ceste:DEFAULT_CONFIG_APPALTO.ceste.map(g=>g.map(p=>({attivita:'Lavaggio ceste',inizio:p[0],fine:p[1],persone:1}))),
  forno:DEFAULT_CONFIG_APPALTO.forno.map(g=>g.filter(p=>Number(p[0])>0).map(p=>({attivita:'Lavaggio forno',inizio:p[1],fine:p[2],persone:Number(p[0])}))),
  vuoti:DEFAULT_CONFIG_APPALTO.vuoti.map(g=>g.map((n,i)=>({attivita:VUOTI_MODELLI[i][0],inizio:VUOTI_MODELLI[i][1],fine:VUOTI_MODELLI[i][2],persone:n})).filter(x=>x.persone>0)),
  grocery:DEFAULT_CONFIG_APPALTO.grocery.map(g=>g.map((n,i)=>({attivita:GROCERY_MODELLI[i][0],inizio:GROCERY_MODELLI[i][1],fine:GROCERY_MODELLI[i][2],persone:n})).filter(x=>x.persone>0))
};
let CONFIG_APPALTO=caricaConfigAppaltoLocale();
let CFG_GIORNO_FABB=0;
let REPARTI=[]; // catalogo reparti Cassano (sola lettura da Nexus)
let ATTIVITA_TUTTE=[]; // catalogo attività Cassano, con ID_Reparto (sola lettura da Nexus)

let DIPENDENTI=[]; // cache dipendenti attivi Cassano

function caricaConfigAppaltoLocale(){
  try{
    const salvata=JSON.parse(localStorage.getItem(CONFIG_APPALTO_KEY)||'{}'),cfg={...structuredClone(DEFAULT_CONFIG_APPALTO),...salvata};
    cfg.fabbisogni={...structuredClone(DEFAULT_CONFIG_APPALTO.fabbisogni),...(salvata.fabbisogni||{})};
    if(!salvata.fabbisogni?.ceste)cfg.fabbisogni.ceste=(cfg.ceste||DEFAULT_CONFIG_APPALTO.ceste).map(g=>g.map(p=>({attivita:'Lavaggio ceste',inizio:p[0],fine:p[1],persone:1})));
    if(!salvata.fabbisogni?.forno)cfg.fabbisogni.forno=(cfg.forno||DEFAULT_CONFIG_APPALTO.forno).map(g=>g.filter(p=>Number(p[0])>0).map(p=>({attivita:'Lavaggio forno',inizio:p[1],fine:p[2],persone:Number(p[0])})));
    return cfg;
  }
  catch(_){return structuredClone(DEFAULT_CONFIG_APPALTO);}
}
function impostaPercorso(obj,path,val){const parti=path.split('.');let nodo=obj;parti.slice(0,-1).forEach(p=>nodo=nodo[p]);nodo[parti.at(-1)]=val;}
async function salvaConfigAppaltoLocale(){
  aggiornaFabbisogniDaDom();
  document.querySelectorAll('[data-config-path]').forEach(el=>impostaPercorso(CONFIG_APPALTO,el.dataset.configPath,el.type==='number'?Number(el.value):el.value));
  localStorage.setItem(CONFIG_APPALTO_KEY,JSON.stringify(CONFIG_APPALTO));
  if(!SESSIONE_CASSANO){toast('Configurazione salvata soltanto sul dispositivo: sessione non attiva.','warn');return;}
  statoSync('Salvataggio configurazione…');
  const{error}=await sb.from('ConfigurazioneCassano').upsert({ID_Magazzino:ID_MAGAZZINO_CASSANO,Dati:CONFIG_APPALTO,AggiornatoIl:new Date().toISOString(),AggiornatoDa:SESSIONE_CASSANO.user.id},{onConflict:'ID_Magazzino'});
  if(error){statoSync('Errore di salvataggio');toast('Configurazione non salvata su Supabase: '+error.message,'err');return;}
  statoSync('Configurazione sincronizzata');toast('Configurazione salvata su Supabase.');
}
function ripristinaConfigAppaltoLocale(){if(!confirm('Ripristinare tutti gli standard appalto ai valori iniziali?'))return;CONFIG_APPALTO=structuredClone(DEFAULT_CONFIG_APPALTO);localStorage.removeItem(CONFIG_APPALTO_KEY);renderConfigTab();}
function inputCfg(path,value,tipo='number',step='1'){return `<input class="cfg-input ${tipo==='time'?'cfg-time':''}" type="${tipo}" step="${step}" value="${value}" data-config-path="${path}">`;}
function minutiOra(ora){const[a,b]=String(ora||'00:00').split(':').map(Number);return a*60+b;}
function oraMinuti(min){const giorno=min>=1440?' +1':'';min=((min%1440)+1440)%1440;return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}${giorno}`;}
function intervalloFabbisogno(r){const inizio=minutiOra(r.inizio);let fine=minutiOra(r.fine);if(fine<=inizio)fine+=1440;return{inizio,fine};}
function opzioniAttivita(rep,val){
  const elenco=rep==='vuoti'?['Compattatori','Muletto','Navetta','Pane','Polimer','Pulizie']:rep==='grocery'?['Ricevimento','Stoccaggio','Abbassamenti','Navettaggio']:rep==='ceste'?['Lavaggio ceste']:['Lavaggio forno'];
  return elenco.map(x=>`<option value="${x}" ${x===val?'selected':''}>${x}</option>`).join('');
}
function righeFabbisognoHtml(rep){
  const righe=CONFIG_APPALTO.fabbisogni[rep][CFG_GIORNO_FABB]||[];
  return righe.map((r,i)=>`<tr data-fabb-riga data-rep="${rep}">
    <td><select data-campo="attivita" style="padding:5px;border:1px solid var(--bordo);border-radius:5px;">${opzioniAttivita(rep,r.attivita)}</select></td>
    <td><input class="cfg-input cfg-time" type="time" data-campo="inizio" value="${r.inizio}"></td>
    <td><input class="cfg-input cfg-time" type="time" data-campo="fine" value="${r.fine}"></td>
    <td><input class="cfg-input" type="number" min="1" step="1" data-campo="persone" value="${r.persone}"></td>
    <td>${((intervalloFabbisogno(r).fine-intervalloFabbisogno(r).inizio)/60*r.persone).toFixed(1)} h</td>
    <td><button class="btn br bsm" onclick="rimuoviFascia('${rep}',${i})">Elimina</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nessuna fascia richiesta.</td></tr>';
}
function grigliaMezzOreHtml(rep){
  const righe=CONFIG_APPALTO.fabbisogni[rep][CFG_GIORNO_FABB]||[];
  if(!righe.length)return '<div class="empty">Aggiungi una fascia per vedere la copertura.</div>';
  const intervalli=righe.map(intervalloFabbisogno);
  const da=Math.floor(Math.min(...intervalli.map(r=>r.inizio))/30)*30;
  const a=Math.ceil(Math.max(...intervalli.map(r=>r.fine))/30)*30;
  const slot=[];for(let m=da;m<a;m+=30)slot.push(m);
  const att=[...new Set(righe.map(r=>r.attivita))];
  return `<div class="tw"><table><thead><tr><th>Attività</th>${slot.map(m=>`<th>${oraMinuti(m)}</th>`).join('')}</tr></thead><tbody>${att.map(nome=>`<tr><td><b>${nome}</b></td>${slot.map(m=>{const n=righe.filter(r=>{const x=intervalloFabbisogno(r);return r.attivita===nome&&x.inizio<=m&&x.fine>m;}).reduce((s,r)=>s+Number(r.persone||0),0);return `<td style="text-align:center;background:${n?'#d3f0e3':'#fff'}">${n||'—'}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function editorRepartoHtml(rep,titolo){return `<div class="card" style="box-shadow:none;margin:10px 0;"><div class="ct">${titolo}</div><div class="tw"><table><thead><tr><th>Attività</th><th>Dalle</th><th>Alle</th><th>Persone contemporanee</th><th>Ore richieste</th><th></th></tr></thead><tbody>${righeFabbisognoHtml(rep)}</tbody></table></div><div class="brow"><button class="btn bo bsm" onclick="aggiungiFascia('${rep}')">＋ Aggiungi fascia</button><button class="btn bo bsm" onclick="aggiornaAnteprimaFabbisogni()">↻ Aggiorna anteprima</button><button class="btn bo bsm" onclick="copiaFabbisognoSettimana('${rep}')">Copia questo giorno su tutta la settimana</button></div><p class="cfg-note" style="margin-top:14px;">Anteprima automatica del fabbisogno ogni 30 minuti</p>${grigliaMezzOreHtml(rep)}</div>`;}
function renderEditorFabbisogniHtml(){return `${editorRepartoHtml('ceste','Lavaggio ceste')}${editorRepartoHtml('forno','Lavaggio forno')}${editorRepartoHtml('vuoti','Vuoti')}${editorRepartoHtml('grocery','Grocery')}`;}
function aggiornaFabbisogniDaDom(){
  ['ceste','forno','vuoti','grocery'].forEach(rep=>{const nodi=[...document.querySelectorAll(`[data-fabb-riga][data-rep="${rep}"]`)];if(!nodi.length)return;CONFIG_APPALTO.fabbisogni[rep][CFG_GIORNO_FABB]=nodi.map(tr=>{const get=c=>tr.querySelector(`[data-campo="${c}"]`).value;return{attivita:get('attivita'),inizio:get('inizio'),fine:get('fine'),persone:Number(get('persone'))||1};});});
}
function cambiaGiornoFabb(v){aggiornaFabbisogniDaDom();CFG_GIORNO_FABB=Number(v);document.getElementById('cfg-fabbisogni-editor').innerHTML=renderEditorFabbisogniHtml();}
function aggiornaAnteprimaFabbisogni(){aggiornaFabbisogniDaDom();document.getElementById('cfg-fabbisogni-editor').innerHTML=renderEditorFabbisogniHtml();}
function aggiungiFascia(rep){aggiornaFabbisogniDaDom();const attivita=rep==='vuoti'?'Compattatori':rep==='grocery'?'Ricevimento':rep==='ceste'?'Lavaggio ceste':'Lavaggio forno';CONFIG_APPALTO.fabbisogni[rep][CFG_GIORNO_FABB].push({attivita,inizio:'06:00',fine:'12:30',persone:1});document.getElementById('cfg-fabbisogni-editor').innerHTML=renderEditorFabbisogniHtml();}
function rimuoviFascia(rep,i){aggiornaFabbisogniDaDom();CONFIG_APPALTO.fabbisogni[rep][CFG_GIORNO_FABB].splice(i,1);document.getElementById('cfg-fabbisogni-editor').innerHTML=renderEditorFabbisogniHtml();}
function copiaFabbisognoSettimana(rep){aggiornaFabbisogniDaDom();if(!confirm(`Copiare le fasce di ${rep} di ${GIORNI[CFG_GIORNO_FABB]} su tutti gli altri giorni?`))return;const modello=CONFIG_APPALTO.fabbisogni[rep][CFG_GIORNO_FABB];CONFIG_APPALTO.fabbisogni[rep]=GIORNI.map(()=>structuredClone(modello));toast('Fabbisogno copiato su tutta la settimana.');}
function renderConfigAppaltoHtml(){
  const carico=GIORNI.map((g,i)=>`<tr><td>${g}</td><td>${inputCfg(`carico.${i}`,CONFIG_APPALTO.carico[i],'number','0.5')} h</td></tr>`).join('');
  const ricevimento=GIORNI.map((g,i)=>`<tr><td>${g}</td><td>${inputCfg(`ricevimento.${i}`,CONFIG_APPALTO.ricevimento?.[i]||0,'number','0.5')} h</td></tr>`).join('');
  return `<div class="card"><div class="ct">Configurazione appalto — standard settimanali</div>
    <div class="fg"><label>Soglia produttività Ortofrutta</label><div>${inputCfg('sogliaProduttivita',CONFIG_APPALTO.sogliaProduttivita,'number','0.1')} colli/ora</div></div>
    <details class="cfg-section"><summary>Ortofrutta — budget fisso Ricevimento</summary><div class="cfg-body"><p class="cfg-note">Ore totali standard per giornata, indipendenti dai colli ricevuti. Il valore 0 lascia il budget da definire.</p><div class="tw"><table><thead><tr><th>Giorno</th><th>Ore standard</th></tr></thead><tbody>${ricevimento}</tbody></table></div></div></details>
    <details class="cfg-section" open><summary>Carico — ore totali giornaliere</summary><div class="cfg-body tw"><table><thead><tr><th>Giorno</th><th>Ore standard</th></tr></thead><tbody>${carico}</tbody></table></div></details>
    <details class="cfg-section"><summary>Fabbisogni per fasce di 30 minuti — Ceste, Forno, Vuoti e Grocery</summary><div class="cfg-body"><p class="cfg-note">Tutti e quattro i reparti funzionano nello stesso modo: imposta fascia e persone contemporaneamente necessarie. Una posizione può essere coperta da più persone in successione; gli ingressi sfalsati restano visibili nella griglia.</p><div class="fg" style="max-width:220px;margin-bottom:12px;"><label>Giorno da configurare</label><select id="cfg-fabb-giorno" onchange="cambiaGiornoFabb(this.value)">${GIORNI.map((g,i)=>`<option value="${i}" ${i===CFG_GIORNO_FABB?'selected':''}>${g}</option>`).join('')}</select></div><div id="cfg-fabbisogni-editor">${renderEditorFabbisogniHtml()}</div></div></details>
    <div class="brow"><button class="btn bp" onclick="salvaConfigAppaltoLocale()">💾 Salva configurazione</button><button class="btn bo" onclick="ripristinaConfigAppaltoLocale()">Ripristina standard</button></div></div>`;
}

function toast(msg,tipo){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=tipo==='err'?'var(--rosso)':(tipo==='warn'?'var(--arancio)':'var(--verde)');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

function mostraLogin(messaggio=''){
  SESSIONE_CASSANO=null;document.getElementById('app').style.display='none';document.getElementById('auth-screen').style.display='flex';
  document.getElementById('auth-msg').innerHTML=messaggio?`<div class="alert aerr">${messaggio}</div>`:'';
}
async function accediResponsabile(event){
  event.preventDefault();if(!projectIdValido()){mostraLogin('Project ID Supabase non valido.');return;}
  const pulsante=document.getElementById('auth-submit');pulsante.disabled=true;pulsante.textContent='Accesso…';
  const email=document.getElementById('auth-email').value.trim(),password=document.getElementById('auth-password').value;
  const{data,error}=await sb.auth.signInWithPassword({email,password});
  pulsante.disabled=false;pulsante.textContent='Accedi';
  if(error){mostraLogin('Accesso non riuscito: '+error.message);return;}
  if(!responsabileAutorizzato(data.session)){await sb.auth.signOut();mostraLogin('Account valido ma non autorizzato al programmatore Cassano.');return;}
  await avviaSessione(data.session);
}
async function esciResponsabile(){await sb.auth.signOut();mostraLogin('');}
async function avviaSessione(sessione){
  if(!projectIdValido()){mostraLogin('Project ID Supabase non valido.');return;}
  if(!responsabileAutorizzato(sessione)){mostraLogin('Account non autorizzato al programmatore Cassano.');return;}
  SESSIONE_CASSANO=sessione;document.getElementById('auth-screen').style.display='none';document.getElementById('app').style.display='block';statoSync(sessione.user.email||'Responsabile autorizzato');
  await Promise.all([caricaDipendenti(),caricaCatalogoAttivita()]);
  await caricaStatoCassanoSupabase();
  showTab('config');
}
async function avviaApp(){
  if(!projectIdValido()){mostraLogin('Project ID Supabase non valido.');return;}
  const{data,error}=await sb.auth.getSession();
  if(error||!data.session){mostraLogin();return;}
  if(!responsabileAutorizzato(data.session)){await sb.auth.signOut();mostraLogin('La sessione presente non è autorizzata al programmatore Cassano.');return;}
  await avviaSessione(data.session);
}
async function caricaDipendenti(){
  const{data,error}=await sb.from('Dipendenti').select('*').eq('Attivo',true);
  if(error){toast('Errore caricando dipendenti: '+error.message,'err');return;}
  DIPENDENTI=(data||[]).filter(d=>{
    const mag=d.Magazzini;
    if(Array.isArray(mag))return mag.map(Number).includes(ID_MAGAZZINO_CASSANO);
    return false;
  }).sort((a,b)=>(a.Nome||'').localeCompare(b.Nome||''));
}

async function caricaCatalogoAttivita(){
  const{data:rep,error:er}=await sb.from('Reparti').select('*').eq('ID_Magazzino',ID_MAGAZZINO_CASSANO);
  if(er){toast('Errore caricando reparti: '+er.message,'err');return;}
  REPARTI=(rep||[]).sort((a,b)=>(a.NomeReparto||'').localeCompare(b.NomeReparto||''));
  const{data:att,error:ea}=await sb.from('Attivita').select('*').eq('ID_Magazzino',ID_MAGAZZINO_CASSANO);
  if(ea){toast('Errore caricando attività: '+ea.message,'err');return;}
  ATTIVITA_TUTTE=(att||[]).sort((a,b)=>(a.NomeAttivita||'').localeCompare(b.NomeAttivita||''));

  // Cerco l'attività "Navetta" nel reparto Ortofrutta per nome (non ho un ID fisso come per le altre tre)
  const navetta=ATTIVITA_TUTTE.find(a=>Number(a.ID_Reparto)===ID_REPARTO_ORTOFRUTTA&&/navett/i.test(String(a.NomeAttivita||a.Nome||a.Descrizione||'')));
  ID_ATTIVITA_NAVETTA=navetta?Number(navetta.ID_Attivita):null;
  if(!ID_ATTIVITA_NAVETTA)console.warn('Attività "Navetta" non trovata nel catalogo Ortofrutta di Nexus: il budget Navetta non potrà mostrare le ore piazzate.');
}

function showTab(id){
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  document.getElementById('nav-'+id).classList.add('on');
  if(id==='config')renderConfigTab();
  else if(id==='previsione')renderPrevisioneTab();
  else if(id==='appalto')renderProgrammazioneAppaltoTab();
  else if(id==='controllo')renderControlloTab();
}

// Utility date — lunedì della settimana di una data qualsiasi
function dataUtc(dataStr){const[y,m,d]=String(dataStr).split('-').map(Number);return new Date(Date.UTC(y,m-1,d));}
function lunediSettimana(dataStr){
  const d=dataUtc(dataStr);
  const dow=d.getUTCDay()||7; // domenica JS=0 -> 7
  d.setUTCDate(d.getUTCDate()-dow+1);
  return d.toISOString().slice(0,10);
}
function addGiorni(dataStr,n){
  const d=dataUtc(dataStr);
  d.setUTCDate(d.getUTCDate()+n);
  return d.toISOString().slice(0,10);
}
function fmtDataIt(dataStr){
  const d=dataUtc(dataStr);
  return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',timeZone:'UTC'});
}
</script>

  const pctNav=parseFloat(document.getElementById('pct-navetta-inp').value)||0;

<script>
function renderPrevisioneTab(){
  const oggi=new Date().toISOString().slice(0,10);
  const lun=lunediSettimana(oggi);
  document.getElementById('mc').innerHTML=`
  <div class="card">
    <div class="ct">Previsione colli — settimana</div>
    <div class="fg" style="max-width:220px;margin-bottom:14px;"><label>Lunedì della settimana</label>
      <input type="date" id="prev-lun" value="${lun}" onchange="caricaPrevisioneSettimana()"></div>
    <div id="prev-body"><div class="loading">⏳ Caricamento...</div></div>
    <div class="brow"><button class="btn bp bsm" onclick="salvaPrevisione()">💾 Salva previsione</button></div>
    <div id="prev-msg"></div>
  </div>`;
  caricaPrevisioneSettimana();
}

async function caricaPrevisioneSettimana(){
  const lun=document.getElementById('prev-lun').value;
  const giorni=[...Array(7)].map((_,i)=>addGiorni(lun,i));
  const{data,error}=await sb.from('PrevisioneColliOrtofrutta').select('*').in('Data',giorni);
  const map={};
  (data||[]).forEach(r=>{map[r.Data]={of:r.ColliPrevisti,gro:r.ColliPrevistiGrocery};});
  const righe=giorni.map((g,i)=>`
    <tr>
      <td>${GIORNI[i]} ${fmtDataIt(g)}</td>
      <td><input type="number" step="1" data-data="${g}" data-rep="of" class="prev-inp" value="${map[g]?.of??''}" style="max-width:140px;"> colli</td>
      <td><input type="number" step="1" data-data="${g}" data-rep="gro" class="prev-inp" value="${map[g]?.gro??''}" style="max-width:140px;"> colli</td>
    </tr>`).join('');
  document.getElementById('prev-body').innerHTML=`<div class="tw"><table><thead><tr><th>Giorno</th><th>Colli Ortofrutta</th><th>Colli Grocery</th></tr></thead><tbody>${righe}</tbody></table></div>`;
}

async function salvaPrevisione(){
  const inputs=document.querySelectorAll('.prev-inp');
  const perData={};
  inputs.forEach(i=>{
    if(i.value==='')return;
    if(!perData[i.dataset.data])perData[i.dataset.data]={};
    perData[i.dataset.data][i.dataset.rep]=parseFloat(i.value)||0;
  });
  const righe=Object.entries(perData).map(([data,v])=>({
    Data:data,
    ColliPrevisti:v.of??null,
    ColliPrevistiGrocery:v.gro??null
  }));
  if(!righe.length){toast('Niente da salvare.','warn');return;}
  const{error}=await sb.from('PrevisioneColliOrtofrutta').upsert(righe,{onConflict:'Data'});
  document.getElementById('prev-msg').innerHTML=error?`<div class="alert aerr">Errore: ${error.message}</div>`:`<div class="alert aok">✔ Previsione salvata.</div>`;
}
</script>

<script>
async function renderControlloTab(){
  const oggi=new Date().toISOString().slice(0,10);
  const lun=lunediSettimana(oggi);
  document.getElementById('mc').innerHTML=`
  <div class="card">
    <div class="ct">Colli reali & controllo produttività</div>
    <div class="fg" style="max-width:220px;margin-bottom:14px;"><label>Lunedì della settimana</label>
      <input type="date" id="ctrl-lun" value="${lun}" onchange="caricaControlloSettimana()"></div>
    <div id="ctrl-body"><div class="loading">⏳ Caricamento...</div></div>
    <div class="brow"><button class="btn bp bsm" onclick="salvaColliReali()">💾 Salva colli reali</button></div>
    <div id="ctrl-msg"></div>
  </div>`;
  await caricaControlloSettimana();
}

async function caricaControlloSettimana(){
  const lun=document.getElementById('ctrl-lun').value;
  const giorni=[...Array(7)].map((_,i)=>addGiorni(lun,i));

  const{data:obiettivi}=await sb.from('ObiettiviAttivitaOrtofrutta').select('*');
  const obMap={};
  (obiettivi||[]).forEach(o=>{obMap[o.ID_Attivita]=o.ObiettivoColliOra;});
  const obiettivoVent=Number(obMap[ID_ATTIVITA_VENTILAZIONE])||0;

  const{data:reali}=await sb.from('ColliRealiOrtofrutta').select('*').in('Data',giorni);
  const realiMap={};
  (reali||[]).forEach(r=>{realiMap[r.Data]=r.ColliReali;});

  const{data:turni}=await sb.from('TurniOrtofruttaPianificati').select('*').in('Data',giorni).eq('ID_Attivita',ID_ATTIVITA_VENTILAZIONE);
  const orePianMap={};
  (turni||[]).forEach(t=>{orePianMap[t.Data]=(orePianMap[t.Data]||0)+(Number(t.OreTurno)||0);});

  const righe=giorni.map((g,i)=>{
    const colliReali=realiMap[g];
    let oreNecessarie=null, delta=null;
    if(obiettivoVent>0&&colliReali!=null&&colliReali!==''){
      oreNecessarie=Number(colliReali)/obiettivoVent;
      const orePian=orePianMap[g]||0;
      delta=orePian-oreNecessarie;
    }
    return `<tr>
      <td>${GIORNI[i]} ${fmtDataIt(g)}</td>
      <td><input type="number" step="1" data-data="${g}" class="reali-inp" value="${colliReali??''}" style="max-width:120px;"></td>
      <td>${oreNecessarie!=null?oreNecessarie.toFixed(1)+' h':'—'}</td>
      <td>${orePianMap[g]!=null?orePianMap[g].toFixed(1)+' h':'—'}</td>

}

async function salvaColliReali(){
  const inputs=document.querySelectorAll('.reali-inp');
  const righe=[...inputs].filter(i=>i.value!=='').map(i=>({Data:i.dataset.data,ColliReali:parseFloat(i.value)||0}));
  if(!righe.length){toast('Niente da salvare.','warn');return;}
  const{error}=await sb.from('ColliRealiOrtofrutta').upsert(righe,{onConflict:'Data'});
  document.getElementById('ctrl-msg').innerHTML=error?`<div class="alert aerr">Errore: ${error.message}</div>`:`<div class="alert aok">✔ Colli reali salvati.</div>`;
  if(!error)caricaControlloSettimana();
}

function creaDaSettimanaPrecedente(){

function rendiSostituzioneStandard(uid){

let PROG_GIORNO_ATTIVO=0;

let PROG_PREVISIONI={}; // Data -> ColliPrevisti
let PROG_DISTRIB_RICEVIMENTO={}; // GiornoIndice (0-7) -> Percentuale
let PROG_PARAMETRI={percLegaggio:0,percNavetta:0}; // percentuali su ore necessarie Ventilazione

async function caricaProgrammazioneSettimana(){
  const lun=document.getElementById('prog-lun').value;
  const dates=[...Array(8)].map((_,i)=>addGiorni(lun,i));

  const coreIds=DIPENDENTI.map(d=>d.ID_Dipendente);

  const{data:esistenti,error:e1}=await sb.from('TurniOrtofruttaPianificati').select('*').in('Data',dates);
  if(e1){document.getElementById('prog-body').innerHTML=`<div class="alert aerr">Errore: ${e1.message}. Hai eseguito aggiorna_turni_pianificati.sql?</div>`;return;}

  const{data:assenze}=await sb.from('Assenze').select('*').in('ID_Dipendente',coreIds).in('Data',dates);
  const assenzeSet=new Set((assenze||[]).map(a=>a.ID_Dipendente+'|'+a.Data));

  const{data:obiettivi}=await sb.from('ObiettiviAttivitaOrtofrutta').select('*');
  PROG_OBIETTIVI={};
  (obiettivi||[]).forEach(o=>{PROG_OBIETTIVI[o.ID_Attivita]=Number(o.ObiettivoColliOra)||0;});

  const{data:previsioni}=await sb.from('PrevisioneColliOrtofrutta').select('*').in('Data',dates);
  PROG_PREVISIONI={};
  (previsioni||[]).forEach(p=>{PROG_PREVISIONI[p.Data]=Number(p.ColliPrevisti)||0;});

  const{data:distrib}=await sb.from('DistribuzioneRicevimentoOrtofrutta').select('*');
  PROG_DISTRIB_RICEVIMENTO={};
  (distrib||[]).forEach(d=>{PROG_DISTRIB_RICEVIMENTO[d.GiornoIndice]=Number(d.Percentuale)||0;});

  const{data:parametri}=await sb.from('ParametriOrtofrutta').select('*').eq('ID',1).maybeSingle();
  PROG_PARAMETRI={
    percLegaggio:Number(parametri?.PercentualeLegaggio)||0,
    percNavetta:Number(parametri?.PercentualeNavetta)||0
  };

  const dipById={};
  DIPENDENTI.forEach(d=>{dipById[d.ID_Dipendente]=d;});

  PROG_SETTIMANA=dates.map((data,gi)=>{
    const turniGiorno=(esistenti||[]).filter(t=>t.Data===data);
    const idsExtra=[...new Set(turniGiorno.map(t=>t.ID_Dipendente).filter(id=>!coreIds.includes(id)))];
    const idsPersone=[...coreIds,...idsExtra].filter(id=>dipById[id]);
    const righe=idsPersone.map(id=>{
      const turniPersona=turniGiorno.filter(t=>t.ID_Dipendente===id).sort((a,b)=>(a.NumeroTurno||1)-(b.NumeroTurno||1));
      const t1=turniPersona.find(t=>(t.NumeroTurno||1)===1);
      const t2=turniPersona.find(t=>(t.NumeroTurno||1)===2);
      return{
        id_dipendente:id,nome:dipById[id].Nome,extra:!coreIds.includes(id),
        assente:assenzeSet.has(id+'|'+data),
        turni:[
          {id_reparto:t1?.ID_Reparto?String(t1.ID_Reparto):'',id_attivita:t1?.ID_Attivita?String(t1.ID_Attivita):'',inizio:t1?.OraInizio||'',fine:t1?.OraFine||''},
          {id_reparto:t2?.ID_Reparto?String(t2.ID_Reparto):'',id_attivita:t2?.ID_Attivita?String(t2.ID_Attivita):'',inizio:t2?.OraInizio||'',fine:t2?.OraFine||''}
        ]
      };
    });
    return{data,label:ETICHETTE_TAB[gi],righe};
  });

  PROG_GIORNO_ATTIVO=0;
  renderProgrammazioneTabs();
}

  document.getElementById('prog-tabs').innerHTML=`<div class="daytabs no-print">
    ${PROG_SETTIMANA.map((g,i)=>`<button class="daytab ${i===PROG_GIORNO_ATTIVO?'on':''}" onclick="selezionaGiornoProg(${i})">${g.label}<br><small>${fmtDataIt(g.data)}</small></button>`).join('')}

function orarioAMinuti(s){
  const m=String(s).match(/^(\d{1,2}):(\d{2})$/);
  if(!m)return null;
  return parseInt(m[1],10)*60+parseInt(m[2],10);
}

function durataTurno(t){
  if(!t.inizio||!t.fine)return 0;
  const i=orarioAMinuti(t.inizio),f=orarioAMinuti(t.fine);
  if(i==null||f==null)return 0;
  let ore=(f-i)/60;
  if(ore<0)ore+=24; // difensivo: non dovrebbe servire, il turno che passa la mezzanotte va sul giorno successivo (Lunedì +1)
  return ore;
}

function oreRiga(riga){
  if(riga.assente)return 0;
  return durataTurno(riga.turni[0])+durataTurno(riga.turni[1]);
}

    <tbody>${righeHtml||'<tr><td colspan="12" class="empty">Nessun dipendente attivo associato al magazzino di Cassano.</td></tr>'}</tbody>
  </table></div>`;

  renderRiepilogoGiorno();

function onCambiaReparto(ri,ti,valore){
  const giorno=PROG_SETTIMANA[PROG_GIORNO_ATTIVO];
  giorno.righe[ri].turni[ti].id_reparto=valore;

function renderRiepilogoGiorno(){
  const giorno=PROG_SETTIMANA[PROG_GIORNO_ATTIVO];
  const colliPrevisti=PROG_PREVISIONI[giorno.data];

  // Ventilazione pura (il Legaggio ha già il suo rapporto percentuale a parte, sotto)
  const orePiazzateVent=giorno.righe.reduce((tot,r)=>{
    if(r.assente)return tot;
    return tot+r.turni.filter(t=>String(t.id_attivita)===String(ID_ATTIVITA_VENTILAZIONE)).reduce((s,t)=>s+durataTurno(t),0);
  },0);
  const obiettivoVent=PROG_OBIETTIVI[ID_ATTIVITA_VENTILAZIONE];
  let oreNecVent=null,completamentoVent=null;
  if(obiettivoVent>0&&colliPrevisti!=null){
    oreNecVent=colliPrevisti/obiettivoVent;
    completamentoVent=oreNecVent>0?(orePiazzateVent/oreNecVent*100):null;
  }
  const clsVent=completamentoVent==null?'':(completamentoVent>=100?'pg':(completamentoVent>=80?'py':'pr'));

  // Ricevimento: colli Ortofrutta della settimana (i 7 giorni "veri" Lun-Dom, esclude Lunedì+1) ÷ obiettivo settimanale,
  // poi spalmato sul giorno attivo con la percentuale impostata in Configurazione
  const colliSettimanali=PROG_SETTIMANA.slice(0,7).reduce((tot,g)=>tot+(PROG_PREVISIONI[g.data]||0),0);
  const obiettivoRic=PROG_OBIETTIVI[ID_ATTIVITA_RICEVIMENTO];
  const oreSettimanaliRic=(obiettivoRic>0)?(colliSettimanali/obiettivoRic):null;
  const percRicGiorno=PROG_DISTRIB_RICEVIMENTO[PROG_GIORNO_ATTIVO];
  const budgetRic=(oreSettimanaliRic!=null&&percRicGiorno!=null)?(oreSettimanaliRic*percRicGiorno/100):null;
  const oreRic=giorno.righe.reduce((tot,r)=>{
    if(r.assente)return tot;
    return tot+r.turni.filter(t=>String(t.id_attivita)===String(ID_ATTIVITA_RICEVIMENTO)).reduce((s,t)=>s+durataTurno(t),0);
  },0);
  const compRic=(budgetRic>0)?(oreRic/budgetRic*100):null;
  const clsRic=compRic==null?'':(compRic>=100?'pg':(compRic>=80?'py':'pr'));

  // Legaggio e Navetta: budget calcolato come percentuale delle ore necessarie di Ventilazione di quel giorno
  const budgetLeg=(oreNecVent!=null)?(oreNecVent*PROG_PARAMETRI.percLegaggio/100):null;
  const oreLeg=giorno.righe.reduce((tot,r)=>{
    if(r.assente)return tot;
    return tot+r.turni.filter(t=>String(t.id_attivita)===String(ID_ATTIVITA_LEGAGGIO)).reduce((s,t)=>s+durataTurno(t),0);
  },0);
  const compLeg=(budgetLeg>0)?(oreLeg/budgetLeg*100):null;
  const clsLeg=compLeg==null?'':(compLeg>=100?'pg':(compLeg>=80?'py':'pr'));

  const budgetNav=(oreNecVent!=null)?(oreNecVent*PROG_PARAMETRI.percNavetta/100):null;
  const oreNav=ID_ATTIVITA_NAVETTA?giorno.righe.reduce((tot,r)=>{
    if(r.assente)return tot;
    return tot+r.turni.filter(t=>String(t.id_attivita)===String(ID_ATTIVITA_NAVETTA)).reduce((s,t)=>s+durataTurno(t),0);
  },0):null;
  const compNav=(budgetNav>0&&oreNav!=null)?(oreNav/budgetNav*100):null;
  const clsNav=compNav==null?'':(compNav>=100?'pg':(compNav>=80?'py':'pr'));

  // Media colli/ora sull'intero reparto Ortofrutta (tutte le attività di quel reparto, non solo Ventilazione+Legaggio)
  const oreTotaliReparto=giorno.righe.reduce((tot,r)=>{
    if(r.assente)return tot;
    return tot+r.turni.filter(t=>String(t.id_reparto)===String(ID_REPARTO_ORTOFRUTTA)).reduce((s,t)=>s+durataTurno(t),0);
  },0);
  const mediaReparto=(colliPrevisti!=null&&oreTotaliReparto>0)?(colliPrevisti/oreTotaliReparto):null;
  const sogliaReparto=Number(CONFIG_APPALTO.sogliaProduttivita)||115;
  const clsMedia=mediaReparto==null?'':(mediaReparto>=sogliaReparto?'pg':'pr');

  document.getElementById('prog-riepilogo').innerHTML=`
    <div class="card" style="background:var(--sfondo);margin-bottom:14px;">
      <div class="ct" style="margin-bottom:8px;">Completamento turno — ${giorno.label} (${fmtDataIt(giorno.data)})${colliPrevisti==null?' · <span style="color:var(--rosso);">nessuna previsione colli Ortofrutta per questo giorno</span>':' · previsti '+colliPrevisti+' colli'}</div>
      <div class="tw"><table><thead><tr><th>Attività</th><th>Ore necessarie / budget</th><th>Ore piazzate</th><th>Completamento</th></tr></thead><tbody>
        <tr>
          <td>Ventilazione</td>
          <td>${oreNecVent!=null?oreNecVent.toFixed(1)+' h':'—'}</td>
          <td>${orePiazzateVent.toFixed(1)} h</td>
          <td>${completamentoVent!=null?`<span class="pill ${clsVent}">${completamentoVent.toFixed(0)}%</span>`:'—'}</td>
        </tr>
        <tr>
          <td>Ricevimento <small style="color:var(--grigio);">(${colliSettimanali} colli/sett. ÷ obiettivo, ${percRicGiorno??'?'}% su questo giorno)</small></td>
          <td>${budgetRic!=null?budgetRic.toFixed(1)+' h':'— imposta obiettivo e percentuali in Configurazione'}</td>
          <td>${oreRic.toFixed(1)} h</td>
          <td>${compRic!=null?`<span class="pill ${clsRic}">${compRic.toFixed(0)}%</span>`:'—'}</td>
        </tr>
        <tr>
          <td>Legaggio <small style="color:var(--grigio);">(${PROG_PARAMETRI.percLegaggio}% delle ore Ventilazione)</small></td>
          <td>${budgetLeg!=null?budgetLeg.toFixed(1)+' h':'—'}</td>
          <td>${oreLeg.toFixed(1)} h</td>
          <td>${compLeg!=null?`<span class="pill ${clsLeg}">${compLeg.toFixed(0)}%</span>`:'—'}</td>
        </tr>
        <tr>
          <td>Navetta <small style="color:var(--grigio);">(${PROG_PARAMETRI.percNavetta}% delle ore Ventilazione)</small></td>
          <td>${budgetNav!=null?budgetNav.toFixed(1)+' h':'—'}</td>
          <td>${oreNav!=null?oreNav.toFixed(1)+' h':'— attività "Navetta" non trovata nel catalogo'}</td>
          <td>${compNav!=null?`<span class="pill ${clsNav}">${compNav.toFixed(0)}%</span>`:'—'}</td>
        </tr>
      </tbody></table></div>
      <div style="margin-top:10px;font-size:0.82rem;">
        Media reparto Ortofrutta: ${oreTotaliReparto.toFixed(1)} h totali ${colliPrevisti!=null?'÷ '+colliPrevisti+' colli':''} =
        ${mediaReparto!=null?`<span class="pill ${clsMedia}">${mediaReparto.toFixed(1)} colli/ora ${mediaReparto>=sogliaReparto?'✔ ok':`✗ sotto i ${sogliaReparto}`}</span>`:'—'}
      </div>
    </div>`;
}

function aggiungiRigaExtra(){
  const giorno=PROG_SETTIMANA[PROG_GIORNO_ATTIVO];
  const disponibili=DIPENDENTI.filter(d=>!giorno.righe.some(r=>r.id_dipendente===d.ID_Dipendente));
  if(!disponibili.length){toast('Nessun altro dipendente disponibile.','warn');return;}
  const nome=prompt(`Nome dipendente da aggiungere (extra) su ${giorno.label} ${fmtDataIt(giorno.data)}:\n`+disponibili.map(d=>d.Nome).join(', '));
  const dip=disponibili.find(d=>d.Nome.toLowerCase()===((nome||'').toLowerCase()));
  if(!dip){toast('Dipendente non trovato tra quelli disponibili.','err');return;}
  giorno.righe.push({id_dipendente:dip.ID_Dipendente,nome:dip.Nome,extra:true,assente:false,turni:[{id_reparto:'',id_attivita:'',inizio:'',fine:''},{id_reparto:'',id_attivita:'',inizio:'',fine:''}]});
  renderGiornoAttivo();
}

function rimuoviRigaExtra(ri){
  const giorno=PROG_SETTIMANA[PROG_GIORNO_ATTIVO];
  giorno.righe.splice(ri,1);
  renderGiornoAttivo();
}

async function salvaProgrammazione(){
  const righe=[];
  const idsTutti=new Set();
  PROG_SETTIMANA.forEach(giorno=>{
    giorno.righe.forEach(r=>{
      idsTutti.add(r.id_dipendente);
      if(r.assente)return;
      r.turni.forEach((t,ti)=>{
        if(!t.inizio||!t.fine)return;
        const ore=durataTurno(t);
        righe.push({
          Data:giorno.data,ID_Dipendente:r.id_dipendente,
          ID_Reparto:t.id_reparto?parseInt(t.id_reparto,10):null,
          ID_Attivita:t.id_attivita?parseInt(t.id_attivita,10):null,
          OraInizio:t.inizio,OraFine:t.fine,OreTurno:ore,NumeroTurno:ti+1
        });
      });
    });
  });
  const dates=PROG_SETTIMANA.map(g=>g.data);
  // Rimuovo prima i turni esistenti della settimana (8 giorni) per le persone toccate, poi reinserisco (evita duplicati/residui)
  await sb.from('TurniOrtofruttaPianificati').delete().in('Data',dates).in('ID_Dipendente',[...idsTutti]);
  if(!righe.length){document.getElementById('prog-msg').innerHTML='<div class="alert awarn">Nessun turno da salvare (griglia vuota).</div>';return;}
  const{error}=await sb.from('TurniOrtofruttaPianificati').insert(righe);
  document.getElementById('prog-msg').innerHTML=error?`<div class="alert aerr">Errore: ${error.message}</div>`:`<div class="alert aok">✔ Programmazione salvata (${righe.length} turni su ${dates.length} giorni).</div>`;
}
avviaApp();
</script>
